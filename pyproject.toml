[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "washer-onto"
version = "0.1.0"
description = "세탁기 개발 모델 선정 의사결정 온톨로지 시스템"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "pydantic>=2.5",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "pandas>=2.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
washer-onto = "washer_onto.cli:main"

[tool.setuptools]
packages = ["washer_onto", "washer_onto.agent"]

[tool.setuptools.package-data]
washer_onto = ["schema/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
